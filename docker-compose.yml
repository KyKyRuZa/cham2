services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
      
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    depends_on:
      - ai-server
    networks:
      - segmentation-network

  ai-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: segment-ai:latest
    container_name: segment-ai
    restart: unless-stopped
    shm_size: 16g
    stop_grace_period: 30s

    environment:
      - PORT=8001
      - HF_HOME=/home/appuser/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - DISABLE_SAFETY_CHECKER=False
    env_file:
      - .env

    deploy:
      resources:
        limits:
          memory: 12G
          cpus: "4"
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      # Кеш моделей Hugging Face (уже скачаны)
      - ./hf_cache:/home/appuser/.cache/huggingface
      # Debug-артефакты запросов (видно на хосте в ./server/debug_output/)
      - ./server/debug_output:/app/debug_output
      # (Опционально) для быстрой правки кода без пересборки:
      # - ./server/app.py:/app/app.py

    networks:
      - segmentation-network

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  segmentation-network:
    driver: bridge
