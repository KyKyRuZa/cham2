services:
  nginx:
    image: nginx:alpine
    container_name: cham2-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
      
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - cham2-segmentation-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: segment-ai:latest
    container_name: cham2-server
    restart: unless-stopped
    shm_size: 16g
    stop_grace_period: 30s

    environment:
      - PORT=8001
      - LOG_MODE=dev
      - LOG_LEVEL=DEBUG
      - HF_HOME=/home/appuser/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - DISABLE_SAFETY_CHECKER=False
    env_file:
      - .env

    deploy:
      resources:
        limits:
          memory: 12G
          cpus: "4"
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      - ./hf_cache_cham2:/home/appuser/.cache/huggingface
      - ./server/debug_output_cham2:/app/debug_output

    networks:
      - cham2-segmentation-network

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  cham2-segmentation-network:
    driver: bridge
